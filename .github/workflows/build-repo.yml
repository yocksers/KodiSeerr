name: Build Kodi Repository

on:
  push:
    branches:
      - main
    # Only run when relevant source files change, avoiding infinite loops
    paths:
      - 'plugin.video.kodiseerr/**'
      - 'repository.kodiseerr/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Grant permissions to commit and push changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Repo Generator Script
        run: python generate_repo.py

      - name: Commit and Push Updated Zips
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zips/
          
          # Only commit if there are changes in the zips directory
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate repo zips and manifest [skip ci]"
            git push
          fi